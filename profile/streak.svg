    font-weight="bold">

    7

</text>

<text
    x="352"
    y="218"
    fill="#8b949e"
    font-family="Arial"
    font-size="12">

    consecutive days

</text>


<!-- ========================= -->
<!-- LONGEST STREAK -->
<!-- ========================= -->

<rect
    x="609"
    y="110"
    width="245"
    height="125"
