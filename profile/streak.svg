<svg xmlns="http://www.w3.org/2000/svg"
width="900"
height="300"
viewBox="0 0 900 300">

<defs>

    <linearGradient id="bg"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop offset="0%" stop-color="#0d1117"/>
        <stop offset="100%" stop-color="#161b22"/>

    </linearGradient>

    <linearGradient id="green"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop offset="0%" stop-color="#39d353"/>
        <stop offset="100%" stop-color="#26a641"/>

    </linearGradient>

</defs>


<!-- MAIN BACKGROUND -->

<rect
    width="900"
    height="300"
    rx="20"
    fill="url(#bg)"
    stroke="#30363d"/>


<!-- TITLE -->

<text
    x="45"
    y="50"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="27"
    font-weight="bold">

    GitHub Contribution Stats

</text>


<!-- USERNAME -->

<text
    x="45"
    y="78"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">

    @UtkarshDashora

</text>


<!-- ========================= -->
<!-- TOTAL CONTRIBUTIONS -->
<!-- ========================= -->

<rect
    x="45"
    y="110"
    width="245"
    height="125"
    rx="16"
    fill="#21262d"
    stroke="#30363d"/>

<text
    x="70"
    y="145"
    fill="#8b949e"
    font-family="Arial"
    font-size="14">

    Total Contributions

</text>

<text
    x="70"
    y="195"
    fill="url(#green)"
    font-family="Arial"
    font-size="42"
    font-weight="bold">

    799

</text>

<text
    x="70"
    y="218"
    fill="#8b949e"
    font-family="Arial"
    font-size="12">

    last 365 days

</text>


